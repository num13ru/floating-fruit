[package]
name = "floating-fruit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "wgpu"] }
egui-wgpu = "0.34"
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
strip = true
opt-level = "z"
lto = true

[package.metadata.bundle]
name = "Floating Fruit"
identifier = "com.floating-fruit.app"
icon = ["assets/icon.icns"]
category = "Music"
